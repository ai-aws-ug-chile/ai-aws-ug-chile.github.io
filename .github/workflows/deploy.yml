name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  # Allows triggering a deploy manually from the Actions tab.
  workflow_dispatch:

# Permissions required by the official Pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# On rapid successive pushes, cancel the stale deploy and ship the newest one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Types and formatting are checked before anything is built, so a broken
  # content file or a bad type fails the run instead of shipping.
  verify:
    name: Check types and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from `packageManager` in package.json, so CI and
      # local machines can never drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check

      - name: Check formatting
        run: pnpm run format:check

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    # Pull requests are built to catch breakage, but only main is published.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
